name: dartantic_cactus
description: >
  Cactus AI provider for dartantic_ai. Provides on-device AI model execution
  using the Cactus framework with support for language models and embeddings
  through GGUF format models.
version: 0.1.0
repository: https://github.com/csells/dartantic_ai
issue_tracker: https://github.com/csells/dartantic_ai/issues

environment:
  sdk: ^3.8.0

dependencies:
  dartantic_interface:
    path: ../dartantic_interface
  cactus:
    git:
      url: https://github.com/cactus-compute/cactus-flutter.git
      ref: 310992ef8b6073f42d34f7872c5c4dc0fcfe7408  # Oct 24, 2025 - thread locks, param changes, reorg
  flutter:
    sdk: flutter
  http: ^1.4.0
  json_schema: ^5.1.8
  logging: ^1.3.0
  meta: ^1.16.0
  path: ^1.8.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  test: ^1.24.0