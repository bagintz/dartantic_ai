name: dartantic_cactus
description: >
  Cactus AI provider for dartantic_ai. Provides on-device AI model execution
  using the Cactus framework with support for language models, vision models,
  and embeddings through GGUF format models.
version: 0.1.0
repository: https://github.com/csells/dartantic_ai
issue_tracker: https://github.com/csells/dartantic_ai/issues

environment:
  sdk: ^3.8.0

dependencies:
  dartantic_interface: ^1.1.0
  cactus: ^0.2.0
  flutter:
    sdk: flutter
  http: ^1.4.0
  json_schema: ^5.1.8
  logging: ^1.3.0
  meta: ^1.16.0
  path: ^1.8.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  test: ^1.24.0